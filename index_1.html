            var last = overlay.querySelector("#f-last").value.trim();
            var pin = overlay.querySelector("#f-pin").value.trim();
            if (!first || !last) { UI.toast("Prénom et nom sont obligatoires.", "bad"); return; }
            if (!/^\d{4}$/.test(pin)) { UI.toast("Le code PIN doit comporter exactement 4 chiffres.", "bad"); return; }
            var dupe = DB.all("employees").find(function (x) { return x.pin === pin && (!existing || x.id !== existing.id); });
            if (dupe) { UI.toast("Ce code PIN est déjà utilisé par un autre employé.", "bad"); return; }
            var patch = {
              firstName: first, lastName: last, poste: overlay.querySelector("#f-poste").value.trim(),
              role: overlay.querySelector("#f-role").value, typeContrat: overlay.querySelector("#f-contrat").value,
              dureeTravail: overlay.querySelector("#f-duree").value ? Number(overlay.querySelector("#f-duree").value) : null,
              dateEmbauche: overlay.querySelector("#f-embauche").value, periodeEssaiFin: overlay.querySelector("#f-essai").value,
              telephone: overlay.querySelector("#f-tel").value, email: overlay.querySelector("#f-email").value,
              pin: pin, badgeId: overlay.querySelector("#f-badge").value.trim(),
              statut: overlay.querySelector("#f-statut").value
            };
            if (canSalary) patch.salaire = overlay.querySelector("#f-salaire").value;
            if (existing) { DB.update("employees", existing.id, patch, user); UI.toast("Fiche mise à jour.", "ok"); }
            else {
              if (!patch.employeeCode) patch.employeeCode = "CDM-" + DB.uid().slice(-4).toUpperCase();
              DB.add("employees", patch, user);
              UI.toast("Employé créé.", "ok");
            }
            UI.closeModal();
            global.Modules.team(container, user);
          });
        }
      });
    }

    function render() {
      var rows = DB.all("employees").filter(function (e) {
        var q = search.toLowerCase();
        return !q || (e.firstName + " " + e.lastName + " " + e.poste).toLowerCase().indexOf(q) !== -1;
      });

      container.innerHTML =
        UI.pageHeader("Équipe / RH", rows.length + " personne(s)", Auth.isAdminLike() ? '<button class="btn btn-primary" id="add-emp">' + ICONS.plus + ' Nouvel employé</button>' : "") +
        UI.card(null,
          '<div class="table-toolbar">' + UI.searchBar("Rechercher un nom ou un poste…", "team-search") + '</div>' +
          UI.dataTable({
            cols: [
              { key: "nom", label: "Employé", render: function (r) { return '<div style="display:flex;align-items:center;gap:10px;">' + UI.avatar(r.id) + '<div><div style="font-weight:600;">' + UI.esc(r.firstName + " " + r.lastName) + '</div><div style="font-size:11.5px;color:var(--ink-soft);">' + UI.esc(r.poste) + '</div></div></div>'; } },
              { key: "role", label: "Rôle", render: function (r) { return UI.esc(DB.ROLES[r.role] ? DB.ROLES[r.role].label : r.role); } },
              { key: "typeContrat", label: "Contrat" },
              { key: "dateEmbauche", label: "Embauche", render: function (r) { return r.dateEmbauche ? DB.fmtDateFR(r.dateEmbauche) : "—"; } },
              { key: "statut", label: "Statut", render: function (r) { return UI.pill(r.statut === "inactif" ? "Inactif" : "Actif", r.statut === "inactif" ? "neutral" : "ok"); } }
            ],
            rows: rows,
            rowActions: Auth.isAdminLike() ? function (r) {
              return '<button data-edit="' + r.id + '" title="Modifier">' + ICONS.edit + '</button>' +
                '<button data-hist="' + r.id + '" title="Historique">' + ICONS.journal + '</button>' +
                '<button data-toggle="' + r.id + '" title="' + (r.statut === "inactif" ? "Réactiver" : "Désactiver") + '">' + (r.statut === "inactif" ? ICONS.check : ICONS.trash) + '</button>';
            } : null,
            emptyText: "Aucun employé."
          })
        );

      var s = container.querySelector("#team-search");
      if (s) { s.value = search; s.addEventListener("input", function () { search = s.value; render(); }); }
      var addBtn = container.querySelector("#add-emp");
      if (addBtn) addBtn.addEventListener("click", function () { openForm(null); });
      container.querySelectorAll("[data-edit]").forEach(function (b) {
        b.addEventListener("click", function () { openForm(DB.get("employees", b.getAttribute("data-edit"))); });
      });
      container.querySelectorAll("[data-toggle]").forEach(function (b) {
        b.addEventListener("click", function () {
          var e = DB.get("employees", b.getAttribute("data-toggle"));
          UI.confirmAction(
            (e.statut === "inactif" ? "Réactiver " : "Désactiver ") + UI.esc(e.firstName + " " + e.lastName) + " ? L'historique complet de cette personne est conservé dans tous les cas.",
            function () {
              DB.update("employees", e.id, { statut: e.statut === "inactif" ? "actif" : "inactif" }, user);
              UI.toast("Statut mis à jour.", "ok");
              render();
            }
          );
        });
      });
      container.querySelectorAll("[data-hist]").forEach(function (b) {
        b.addEventListener("click", function () { openHistoryModal(b.getAttribute("data-hist")); });
      });
    }

    function openHistoryModal(empId) {
      var entries = DB.Journal.all().filter(function (j) { return j.entityId === empId; });
      UI.openModal({
        title: "Historique — " + UI.employeeName(empId),
        body: entries.length ? entries.map(function (j) {
          return '<div class="timeline-item"><div class="t-time">' + DB.fmtDateTimeFR(j.at) + '</div><div class="t-text"><b>' + UI.esc(j.userName) + '</b> — ' + j.action + (j.note ? " (" + UI.esc(j.note) + ")" : "") + '</div></div>';
        }).join("") : UI.emptyState("Aucune entrée d'historique."),
        footer: '<button class="btn btn-secondary" id="close-h">Fermer</button>',
        onMount: function (overlay) { overlay.querySelector("#close-h").addEventListener("click", UI.closeModal); }
      });
    }

    render();
  };

  /* ================= PLANNING ================= */
  global.Modules.planning = function (container, user) {
    var canEdit = Auth.isAdminLike();
    var weekStart = mondayOf(new Date());

    function mondayOf(d) {
      var day = d.getDay();
      var diff = (day === 0 ? -6 : 1 - day);
      var m = new Date(d); m.setDate(d.getDate() + diff); m.setHours(0, 0, 0, 0);
      return m;
    }
    function addDays(d, n) { var r = new Date(d); r.setDate(d.getDate() + n); return r; }
    function iso(d) { return DB.fmtDate(d); }
    var dayLabels = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

    function shiftForm(existing, empId, date) {
      var s = existing || { start: "10:00", end: "18:00", type: "matin" };
      return '' +
        '<div class="field"><label>Employé</label><input value="' + UI.esc(UI.employeeName(empId)) + '" disabled /></div>' +
        '<div class="field"><label>Date</label><input value="' + DB.fmtDateFR(date) + '" disabled /></div>' +
        '<div class="field-row">' +
        '<div class="field"><label>Début *</label><input type="time" id="s-start" value="' + s.start + '" /></div>' +
        '<div class="field"><label>Fin *</label><input type="time" id="s-end" value="' + s.end + '" /></div>' +
        '</div>' +
        '<div class="field"><label>Type</label><select id="s-type"><option value="matin" ' + (s.type === "matin" ? "selected" : "") + '>Matin</option><option value="soir" ' + (s.type === "soir" ? "selected" : "") + '>Soir/Après-midi</option></select></div>';
    }

    function openShiftModal(existing, empId, dateIso) {
      UI.openModal({
        title: existing ? "Modifier le créneau" : "Ajouter un créneau",
        body: shiftForm(existing, empId, dateIso),
        footer: (existing ? '<button class="btn btn-danger" id="del" style="margin-right:auto;">Supprimer</button>' : "") +
          '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Enregistrer</button>',
        onMount: function (overlay) {
          overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
          if (existing) overlay.querySelector("#del").addEventListener("click", function () {
            UI.confirmAction("Supprimer ce créneau planifié ?", function () {
              DB.remove("shifts", existing.id, user);
              UI.closeModal(); global.Modules.planning(container, user);
            });
          });
          overlay.querySelector("#save").addEventListener("click", function () {
            var patch = { start: overlay.querySelector("#s-start").value, end: overlay.querySelector("#s-end").value, type: overlay.querySelector("#s-type").value };
            if (existing) DB.update("shifts", existing.id, patch, user);
            else DB.add("shifts", Object.assign({ employeeId: empId, date: dateIso, published: false }, patch), user);
            UI.toast("Planning enregistré.", "ok");
            UI.closeModal(); global.Modules.planning(container, user);
          });
        }
      });
    }

    function render() {
      var employees = DB.all("employees").filter(function (e) { return e.statut !== "inactif"; });
      var days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(weekStart, i); });
      var shifts = DB.all("shifts");

      var grid = '<div class="week-grid"><div class="wg-cell wg-head"></div>' +
        days.map(function (d) { return '<div class="wg-cell wg-head">' + dayLabels[d.getDay() === 0 ? 6 : d.getDay() - 1] + '<br/>' + iso(d).slice(8, 10) + '/' + iso(d).slice(5, 7) + '</div>'; }).join("");

      employees.forEach(function (e) {
        grid += '<div class="wg-cell wg-name">' + UI.esc(e.firstName + " " + e.lastName.charAt(0) + ".") + '</div>';
        days.forEach(function (d) {
          var di = iso(d);
          var s = shifts.find(function (x) { return x.employeeId === e.id && x.date === di; });
          if (s) {
            grid += '<div class="wg-cell"><div class="shift-chip ' + s.type + '" data-shift="' + s.id + '">' + s.start + '–' + s.end + (s.published ? "" : " ⚬") + '</div></div>';
          } else {
            grid += '<div class="wg-cell">' + (canEdit ? '<button class="wg-add" data-add-emp="' + e.id + '" data-add-date="' + di + '">+</button>' : "") + '</div>';
          }
        });
      });
      grid += '</div>';

      container.innerHTML =
        UI.pageHeader("Planning", "Semaine du " + DB.fmtDateFR(iso(weekStart)) + " au " + DB.fmtDateFR(iso(days[6])),
          '<button class="btn btn-secondary" id="prev-w">← Semaine préc.</button>' +
          '<button class="btn btn-secondary" id="next-w">Semaine suiv. →</button>' +
          (canEdit ? '<button class="btn btn-primary" id="publish-w">Publier la semaine</button>' : "")) +
        '<div class="hint" style="margin-bottom:14px;">⚬ = créneau non publié, visible uniquement par l\'équipe encadrante.</div>' +
        UI.card(null, grid);

      container.querySelector("#prev-w").addEventListener("click", function () { weekStart = addDays(weekStart, -7); render(); });
      container.querySelector("#next-w").addEventListener("click", function () { weekStart = addDays(weekStart, 7); render(); });
      var pub = container.querySelector("#publish-w");
      if (pub) pub.addEventListener("click", function () {
        var count = 0;
        days.forEach(function (d) {
          shifts.filter(function (s) { return s.date === iso(d) && !s.published; }).forEach(function (s) {
            DB.update("shifts", s.id, { published: true }, user, { silent: true });
            count++;
          });
        });
        if (count) DB.Journal.log(user, "update", "shifts", null, null, { count: count }, "Publication de la semaine du " + iso(weekStart));
        UI.toast(count ? (count + " créneau(x) publié(s)." ) : "Rien à publier.", "ok");
        render();
      });
      container.querySelectorAll("[data-shift]").forEach(function (el) {
        el.addEventListener("click", function () {
          if (!canEdit) return;
          var s = DB.get("shifts", el.getAttribute("data-shift"));
          openShiftModal(s, s.employeeId, s.date);
        });
      });
      container.querySelectorAll("[data-add-emp]").forEach(function (el) {
        el.addEventListener("click", function () { openShiftModal(null, el.getAttribute("data-add-emp"), el.getAttribute("data-add-date")); });
      });
    }

    render();
  };

  /* ================= POINTAGE (vue admin + corrections) ================= */
  global.Modules.pointage = function (container, user) {
    var filterDate = DB.fmtDate();
    var canEdit = Auth.isAdminLike();

    var typeLabels = { arrivee: "Arrivée", pause: "Pause", reprise: "Reprise", depart: "Départ" };

    function correctionModal(punch) {
      UI.openModal({
        title: "Corriger un pointage",
        body: '' +
          '<div class="field"><label>Employé</label><input value="' + UI.esc(UI.employeeName(punch.employeeId)) + '" disabled /></div>' +
          '<div class="field"><label>Type</label><input value="' + typeLabels[punch.type] + '" disabled /></div>' +
          '<div class="field"><label>Horodatage actuel</label><input value="' + DB.fmtDateTimeFR(punch.timestamp) + '" disabled /></div>' +
          '<div class="field"><label>Nouvel horodatage *</label><input type="time" id="c-time" value="' + punch.timestamp.slice(11, 16) + '" /></div>' +
          '<div class="field"><label>Motif de la correction * <span class="hint">(obligatoire — conservé dans l\'historique, jamais de suppression silencieuse)</span></label><textarea id="c-reason" rows="2" placeholder="ex. oubli de pointage, la tablette était hors service…"></textarea></div>',
        footer: '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Valider la correction</button>',
        onMount: function (overlay) {
          overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
          overlay.querySelector("#save").addEventListener("click", function () {
            var reason = overlay.querySelector("#c-reason").value.trim();
            var time = overlay.querySelector("#c-time").value;
            if (!reason) { UI.toast("Le motif est obligatoire.", "bad"); return; }
            if (!time) { UI.toast("Nouvel horodatage requis.", "bad"); return; }
            var oldTs = punch.timestamp;
            var newTsIso = new Date(punch.timestamp.slice(0, 10) + "T" + time + ":00").toISOString();
            var corrections = (punch.corrections || []).concat([{ oldTimestamp: oldTs, newTimestamp: newTsIso, by: user.id, byName: user.firstName + " " + user.lastName, at: DB.nowISO(), reason: reason }]);
            DB.update("punches", punch.id, { timestamp: newTsIso, corrections: corrections }, user, { note: "Correction pointage : " + reason });
            UI.toast("Pointage corrigé — ancienne valeur conservée dans l'historique.", "ok");
            UI.closeModal();
            global.Modules.pointage(container, user);
          });
        }
      });
    }

    function manualPunchModal() {
      var employees = DB.all("employees").filter(function (e) { return e.statut !== "inactif"; });
      UI.openModal({
        title: "Ajouter un pointage manuel",
        body: '' +
          '<div class="field"><label>Employé *</label><select id="m-emp">' + employees.map(function (e) { return '<option value="' + e.id + '">' + UI.esc(e.firstName + " " + e.lastName) + '</option>'; }).join("") + '</select></div>' +
          '<div class="field"><label>Type *</label><select id="m-type"><option value="arrivee">Arrivée</option><option value="pause">Pause</option><option value="reprise">Reprise</option><option value="depart">Départ</option></select></div>' +
          '<div class="field-row"><div class="field"><label>Date *</label><input type="date" id="m-date" value="' + filterDate + '" /></div><div class="field"><label>Heure *</label><input type="time" id="m-time" /></div></div>' +
          '<div class="field"><label>Motif * <span class="hint">(pointage saisi manuellement, hors tablette)</span></label><textarea id="m-reason" rows="2"></textarea></div>',
        footer: '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Enregistrer</button>',
        onMount: function (overlay) {
          overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
          overlay.querySelector("#save").addEventListener("click", function () {
            var reason = overlay.querySelector("#m-reason").value.trim();
            var time = overlay.querySelector("#m-time").value, date = overlay.querySelector("#m-date").value;
            if (!reason || !time || !date) { UI.toast("Tous les champs sont obligatoires.", "bad"); return; }
            DB.add("punches", {
              employeeId: overlay.querySelector("#m-emp").value, type: overlay.querySelector("#m-type").value,
              timestamp: new Date(date + "T" + time + ":00").toISOString(), device: "saisie manuelle", corrections: []
            }, user, {});
            DB.Journal.log(user, "correction", "punches", null, null, null, "Ajout manuel : " + reason);
            UI.toast("Pointage manuel ajouté.", "ok");
            UI.closeModal(); global.Modules.pointage(container, user);
          });
        }
      });
    }

    function render() {
      var punches = DB.all("punches").filter(function (p) { return p.timestamp.slice(0, 10) === filterDate; })
        .sort(function (a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });

      container.innerHTML =
        UI.pageHeader("Pointage", "Vue journalière des pointages employés",
          (canEdit ? '<button class="btn btn-primary" id="add-manual">' + ICONS.plus + ' Pointage manuel</button>' : "") +
          '<button class="btn btn-secondary" id="export-csv">Exporter CSV</button>') +
        '<div class="field" style="max-width:220px;margin-bottom:16px;"><input type="date" id="f-date" value="' + filterDate + '" /></div>' +
        UI.card(null, UI.dataTable({
          cols: [
            { key: "emp", label: "Employé", render: function (p) { return '<div style="display:flex;align-items:center;gap:10px;">' + UI.avatar(p.employeeId) + UI.esc(UI.employeeName(p.employeeId)) + '</div>'; } },
            { key: "type", label: "Type", render: function (p) { return UI.pill(typeLabels[p.type], p.type === "depart" ? "neutral" : "ok"); } },
            { key: "heure", label: "Heure", render: function (p) { return p.timestamp.slice(11, 16); } },
            { key: "device", label: "Source", render: function (p) { return UI.esc(p.device || "—"); } },
            { key: "corr", label: "Corrections", render: function (p) { return (p.corrections && p.corrections.length) ? UI.pill(p.corrections.length + " correction(s)", "warn") : "—"; } }
          ],
          rows: punches,
          rowActions: canEdit ? function (p) { return '<button data-corr="' + p.id + '" title="Corriger">' + ICONS.edit + '</button>' + (p.corrections && p.corrections.length ? '<button data-hist="' + p.id + '" title="Historique corrections">' + ICONS.journal + '</button>' : ""); } : null,
          emptyText: "Aucun pointage ce jour-là."
        }));

      container.querySelector("#f-date").addEventListener("change", function (e) { filterDate = e.target.value; render(); });
      container.querySelector("#export-csv").addEventListener("click", function () {
        UI.exportCSV("pointage_" + filterDate + ".csv", punches.map(function (p) {
          return { employe: UI.employeeName(p.employeeId), type: typeLabels[p.type], heure: p.timestamp.slice(11, 16), source: p.device, corrections: (p.corrections || []).length };
        }));
      });
      var addBtn = container.querySelector("#add-manual");
      if (addBtn) addBtn.addEventListener("click", manualPunchModal);
      container.querySelectorAll("[data-corr]").forEach(function (b) { b.addEventListener("click", function () { correctionModal(DB.get("punches", b.getAttribute("data-corr"))); }); });
      container.querySelectorAll("[data-hist]").forEach(function (b) {
        b.addEventListener("click", function () {
          var p = DB.get("punches", b.getAttribute("data-hist"));
          UI.openModal({
            title: "Historique des corrections",
            body: (p.corrections || []).map(function (c) {
              return '<div class="diff-box"><span class="old">' + DB.fmtDateTimeFR(c.oldTimestamp) + '</span>→<span class="new">' + DB.fmtDateTimeFR(c.newTimestamp) + '</span>' +
                '<div style="margin-top:6px;">Par <b>' + UI.esc(c.byName) + '</b> le ' + DB.fmtDateTimeFR(c.at) + '</div>' +
                '<div style="margin-top:4px;font-style:italic;">Motif : ' + UI.esc(c.reason) + '</div></div>';
            }).join(""),
            footer: '<button class="btn btn-secondary" id="close-h">Fermer</button>',
            onMount: function (overlay) { overlay.querySelector("#close-h").addEventListener("click", UI.closeModal); }
          });
        });
      });
    }

    render();
  };

  /* ================= CONGÉS / ABSENCES ================= */
  var LEAVE_TYPES = { cp: "Congés payés", maladie: "Arrêt maladie", sans_solde: "Sans solde", autre: "Autre" };
  var LEAVE_STATUS = { en_attente: "En attente", acceptee: "Acceptée", refusee: "Refusée" };

  function leaveRequestForm(employees, forEmployeeId) {
    return '' +
      (employees ? '<div class="field"><label>Employé *</label><select id="l-emp">' + employees.map(function (e) { return '<option value="' + e.id + '">' + UI.esc(e.firstName + " " + e.lastName) + '</option>'; }).join("") + '</select></div>' : "") +
      '<div class="field"><label>Type *</label><select id="l-type">' + Object.keys(LEAVE_TYPES).map(function (k) { return '<option value="' + k + '">' + LEAVE_TYPES[k] + '</option>'; }).join("") + '</select></div>' +
      '<div class="field-row"><div class="field"><label>Du *</label><input type="date" id="l-start" /></div><div class="field"><label>Au *</label><input type="date" id="l-end" /></div></div>' +
      '<div class="field"><label>Motif / commentaire</label><textarea id="l-note" rows="2"></textarea></div>';
  }

  function openLeaveRequestModal(container, user, forEmployeeId, onDone) {
    var employees = forEmployeeId ? null : DB.all("employees").filter(function (e) { return e.statut !== "inactif"; });
    UI.openModal({
      title: "Nouvelle demande de congé / absence",
      body: leaveRequestForm(employees, forEmployeeId),
      footer: '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Envoyer la demande</button>',
      onMount: function (overlay) {
        overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
        overlay.querySelector("#save").addEventListener("click", function () {
          var start = overlay.querySelector("#l-start").value, end = overlay.querySelector("#l-end").value;
          if (!start || !end) { UI.toast("Dates obligatoires.", "bad"); return; }
          var empId = forEmployeeId || overlay.querySelector("#l-emp").value;
          DB.add("leaves", {
            employeeId: empId, type: overlay.querySelector("#l-type").value, startDate: start, endDate: end,
            note: overlay.querySelector("#l-note").value, status: "en_attente", statusHistory: [{ status: "en_attente", at: DB.nowISO(), by: user.id }]
          }, user);
          UI.toast("Demande envoyée.", "ok");
          UI.closeModal();
          onDone();
        });
      }
    });
  }

  global.Modules.leaves = function (container, user) {
    var canManage = Auth.isAdminLike();
    var filterStatus = "";

    function render() {
      var rows = DB.all("leaves").filter(function (l) { return !filterStatus || l.status === filterStatus; })
        .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

      container.innerHTML =
        UI.pageHeader("Congés / Absences", rows.length + " demande(s)",
          '<button class="btn btn-primary" id="new-leave">' + ICONS.plus + ' Nouvelle demande</button>') +
        '<div class="field" style="max-width:220px;margin-bottom:16px;"><select id="f-status" class="filter-select"><option value="">Tous les statuts</option>' +
        Object.keys(LEAVE_STATUS).map(function (k) { return '<option value="' + k + '">' + LEAVE_STATUS[k] + '</option>'; }).join("") + '</select></div>' +
        UI.card(null, UI.dataTable({
          cols: [
            { key: "emp", label: "Employé", render: function (r) { return UI.esc(UI.employeeName(r.employeeId)); } },
            { key: "type", label: "Type", render: function (r) { return LEAVE_TYPES[r.type] || r.type; } },
            { key: "periode", label: "Période", render: function (r) { return DB.fmtDateFR(r.startDate) + " → " + DB.fmtDateFR(r.endDate); } },

  global.Modules.trainings = function (container, user) {

      if (!t.expiryDate) return { label: "À planifier", tone: "warn" };
      var days = Math.ceil((new Date(t.expiryDate) - new Date(DB.fmtDate())) / 86400000);
      if (days < 0) return { label: "Expirée", tone: "bad" };
      if (days <= 30) return { label: "Échéance proche", tone: "warn" };
      return { label: "Valide", tone: "ok" };
    }

      var employees = DB.all("employees").filter(function (e) { return e.statut !== "inactif"; });

        '<div class="field"><label>Employé *</label><select id="t-emp">' + employees.map(function (e) { return '<option value="' + e.id + '" ' + (t.employeeId === e.id ? "selected" : "") + '>' + UI.esc(e.firstName + " " + e.lastName) + '</option>'; }).join("") + '</select></div>' +

        '<div class="field"><label>Organisme</label><input id="t-org" value="' + UI.esc(t.organism || "") + '" /></div>';
    }

    function render() {

      var rows = DB.all("trainings").sort(function (a, b) { return new Date(b.date || 0) - new Date(a.date || 0); });

      container.innerHTML =

        '<div class="alert-banner warn">' + UI.severityDot("warn") + '<span>' + UI.esc(settings.trainingRulesNote || "Liste des formations obligatoires à valider selon l'activité exacte de l'établissement.") + '</span></div>' +
        UI.card(null, UI.dataTable({
          cols: [
            { key: "emp", label: "Employé", render: function (r) { return UI.esc(UI.employeeName(r.employeeId)); } },
            { key: "name", label: "Formation" },
            { key: "date", label: "Réalisée le", render: function (r) { return r.date ? DB.fmtDateFR(r.date) : "—"; } },
            { key: "expiry", label: "Expire le", render: function (r) { return r.expiryDate ? DB.fmtDateFR(r.expiryDate) : "—"; } },
            { key: "status", label: "Statut", render: function (r) { var s = statusOf(r); return UI.pill(s.label, s.tone); } }
          ],
          rows: rows,
          rowActions: canManage ? function (r) { return '<button data-edit="' + r.id + '" title="Modifier">' + ICONS.edit + '</button><button data-del="' + r.id + '" title="Supprimer">' + ICONS.trash + '</button>'; } : null,
          emptyText: "Aucune formation enregistrée."
        }));

      function openForm(existing) {
        UI.openModal({
          title: existing ? "Modifier la formation" : "Nouvelle formation",

          onMount: function (overlay) {
            overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
            overlay.querySelector("#save").addEventListener("click", function () {
              var name = overlay.querySelector("#t-name").value.trim();
              if (!name) { UI.toast("Le nom de la formation est obligatoire.", "bad"); return; }
              var patch = {
                employeeId: overlay.querySelector("#t-emp").value, name: name,
                date: overlay.querySelector("#t-date").value, expiryDate: overlay.querySelector("#t-expiry").value || null,

      if (addBtn) addBtn.addEventListener("click", function () { openForm(null); });
      container.querySelectorAll("[data-edit]").forEach(function (b) { b.addEventListener("click", function () { openForm(DB.get("trainings", b.getAttribute("data-edit"))); }); });
      container.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", function () {

            DB.remove("trainings", b.getAttribute("data-del"), user);

          });

      } else {

        body.innerHTML = '<div style="margin-bottom:14px;text-align:right;"><button class="btn btn-secondary" id="export-h">Exporter CSV</button></div>' +
          UI.card(null, UI.dataTable({

        UI.card(null, UI.dataTable({
          cols: [
            { key: "number", label: "N°", render: function (a) { return '<b>' + a.number + '</b>'; } },

            { key: "source", label: "Origine", render: function (a) { return UI.esc(a.source); } },
            { key: "description", label: "Description" },

            { key: "status", label: "Statut", render: function (a) { return UI.pill(a.status === "resolu" ? "Résolue" : "Ouverte", a.status === "resolu" ? "ok" : "bad"); } }
          ],

          rowActions: canManage ? function (a) { return a.status === "resolu" ? '<button data-reopen="' + a.id + '" title="Rouvrir">' + ICONS.alerts + '</button><button data-view="' + a.id + '" title="Détails">' + ICONS.journal + '</button>' : '<button data-resolve="' + a.id + '" title="Traiter">' + ICONS.check + '</button>'; } : null,

      container.querySelector("#f-status").addEventListener("change", function (e) { filterStatus = e.target.value; render(); });
      container.querySelector("#add-anom").addEventListener("click", openNewModal);
      container.querySelectorAll("[data-resolve]").forEach(function (b) { b.addEventListener("click", function () { openResolveModal(DB.get("anomalies", b.getAttribute("data-resolve"))); }); });
      container.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { openViewModal(DB.get("anomalies", b.getAttribute("data-view"))); }); });

          });
        });
      });
    }

    function openNewModal() {
      UI.openModal({
        title: "Signaler une anomalie",

          '<div class="field"><label>Gravité</label><select id="a-sev"><option value="warn">Vigilance</option><option value="bad">Critique</option></select></div>',

          overlay.querySelector("#save").addEventListener("click", function () {
            var desc = overlay.querySelector("#a-desc").value.trim();
            if (!desc) { UI.toast("La description est obligatoire.", "bad"); return; }
            DB.add("anomalies", {
              number: Domain.nextAnomalyNumber(), source: "manuelle", refId: null, description: desc,
              severity: overlay.querySelector("#a-sev").value, status: "ouverte",
              detectedAt: DB.nowISO(), detectedBy: user.id, correctiveAction: "", correctiveActionBy: null, correctiveActionAt: null
            }, user);
            UI.toast("Anomalie enregistrée.", "ok"); UI.closeModal(); render();
          });
        }
      });
    }

    function openResolveModal(a) {
      UI.openModal({
        title: "Traiter l'anomalie " + a.number,
        body: '<p style="font-size:13.5px;">' + UI.esc(a.description) + '</p>' +
          '<div class="field"><label>Action corrective mise en œuvre *</label><textarea id="r-action" rows="3" placeholder="Décrire l\'action corrective réalisée…"></textarea></div>',
        footer: '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Marquer comme résolue</button>',
        onMount: function (overlay) {
          overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
          overlay.querySelector("#save").addEventListener("click", function () {
            var action = overlay.querySelector("#r-action").value.trim();
            if (!action) { UI.toast("L'action corrective est obligatoire.", "bad"); return; }
            DB.update("anomalies", a.id, { status: "resolu", correctiveAction: action, correctiveActionBy: user.id, correctiveActionAt: DB.nowISO() }, user, { note: "Résolution" });
            UI.toast("Anomalie résolue.", "ok"); UI.closeModal(); render();
          });
        }
      });
    }

    function openViewModal(a) {
      UI.openModal({
        title: a.number,
        body: '<p style="font-size:13.5px;"><b>Description :</b> ' + UI.esc(a.description) + '</p>' +

          '<p style="font-size:13.5px;"><b>Action corrective :</b> ' + UI.esc(a.correctiveAction || "—") + '</p>' +
          '<p style="font-size:13.5px;"><b>Résolue le :</b> ' + (a.correctiveActionAt ? DB.fmtDateTimeFR(a.correctiveActionAt) + " par " + UI.employeeName(a.correctiveActionBy) : "—") + '</p>',
        footer: '<button class="btn btn-secondary" id="close">Fermer</button>',
        onMount: function (overlay) { overlay.querySelector("#close").addEventListener("click", UI.closeModal); }
      });
    }

    render();
  };
})(window);

              supplierId: overlay.querySelector("#p-supplier").value || null,

      });

    function openMovementModal(product) {
      UI.openModal({
        title: "Mouvement de stock — " + product.name,
        body: '<div class="field"><label>Stock actuel</label><input value="' + product.stockCurrent + " " + UI.esc(product.unit || "") + '" disabled /></div>' +
          '<div class="field"><label>Type de mouvement *</label><select id="m-type"><option value="entree">Entrée (réapprovisionnement)</option><option value="sortie">Sortie (vente / perte)</option><option value="ajustement">Ajustement (correction manuelle)</option></select></div>' +
          '<div class="field"><label>Quantité *</label><input type="number" id="m-qty" /></div>' +
          '<div class="field"><label>Motif *</label><input id="m-reason" placeholder="ex. livraison, casse, correction inventaire…" /></div>',
        footer: '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Enregistrer</button>',
        onMount: function (overlay) {
          overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);
          overlay.querySelector("#save").addEventListener("click", function () {
            var type = overlay.querySelector("#m-type").value;
            var qty = Number(overlay.querySelector("#m-qty").value || 0);
            var reason = overlay.querySelector("#m-reason").value.trim();
            if (!qty || !reason) { UI.toast("Quantité et motif sont obligatoires.", "bad"); return; }
            var delta = type === "entree" ? qty : type === "sortie" ? -qty : qty;
            var newStock = Math.max(0, product.stockCurrent + delta);
            DB.add("stockMovements", { productId: product.id, type: type, qty: qty, reason: reason }, user);
            DB.update("products", product.id, { stockCurrent: newStock }, user, { note: "Mouvement " + type + " : " + reason });

          });
        }
      });
    }

    function openInventoryModal() {
      var products = DB.all("products");
      UI.openModal({
        title: "Nouvel inventaire (théorique vs réel)",
        body: '<div class="hint" style="margin-bottom:12px;">Saisissez la quantité réellement comptée pour chaque produit. Le stock système sera ajusté automatiquement et l\'écart sera tracé.</div>' +
          products.map(function (p) {
            return '<div class="field-row"><div class="field" style="flex:2;"><label>' + UI.esc(p.name) + '</label><input value="Théorique : ' + p.stockCurrent + '" disabled /></div>' +
              '<div class="field"><label>Réel</label><input type="number" id="inv_' + p.id + '" value="' + p.stockCurrent + '" /></div></div>';

        footer: '<button class="btn btn-secondary" id="cancel">Annuler</button><button class="btn btn-primary" id="save">Valider l\'inventaire</button>',

          overlay.querySelector("#cancel").addEventListener("click", UI.closeModal);

              return { productId: p.id, name: p.name, theorique: p.stockCurrent, reel: reel, ecart: ecart };
            });
            var inv = DB.add("inventories", { lines: lines }, user);
            DB.Journal.log(user, "create", "inventories", inv.id, null, { lines: lines.length }, "Inventaire réalisé");
            UI.toast("Inventaire enregistré et stock ajusté.", "ok"); UI.closeModal(); render();
          });
        }
      });
    }

    render();
  };

})(window);

(function (window) {

  global.Modules.reports = function (container, user) {
    var type = "pointage";

    var TYPES = {
      pointage: "Pointage", haccp: "Contrôles HACCP", temperatures: "Températures",
      cleaning: "Nettoyage", anomalies: "Anomalies", stock: "Mouvements de stock"

    function dataFor(t) {
      function inRange(d) { return d >= from && d <= to; }

        .map(function (p) { return { date: p.timestamp.slice(0, 10), heure: p.timestamp.slice(11, 16), employe: UI.employeeName(p.employeeId), type: p.type, source: p.device }; });
      if (t === "haccp") return DB.all("haccpLogs").filter(function (l) { return inRange(l.date); })
        .map(function (l) { var tpl = DB.get("haccpTemplates", l.templateId); return { date: l.date, heure: l.time, controle: tpl ? tpl.name : "", employe: UI.employeeName(l.employeeId), resultat: l.ok ? "conforme" : "non conforme" }; });
      if (t === "temperatures") return DB.all("tempReadings").filter(function (r) { return inRange(r.date); })
        .map(function (r) { var eq = DB.get("equipment", r.equipmentId); return { date: r.date, heure: r.time, equipement: eq ? eq.name : "", valeur: r.value, conforme: r.conform ? "oui" : "non", releve_par: UI.employeeName(r.by) }; });
      if (t === "cleaning") return DB.all("cleaningLogs").filter(function (l) { return inRange(l.date); })
        .map(function (l) { var tpl = DB.get("cleaningTemplates", l.templateId); return { date: l.date, heure: l.time, zone: tpl ? tpl.name : "", employe: UI.employeeName(l.employeeId) }; });
      if (t === "anomalies") return DB.all("anomalies").filter(function (a) { return inRange(a.detectedAt.slice(0, 10)); })
        .map(function (a) { return { numero: a.number, date: a.detectedAt.slice(0, 10), source: a.source, description: a.description, gravite: a.severity, statut: a.status, action_corrective: a.correctiveAction || "" }; });
      if (t === "stock") return DB.all("stockMovements").filter(function (m) { return inRange((m.createdAt || "").slice(0, 10)); })
        .map(function (m) { var p = DB.get("products", m.productId); return { date: (m.createdAt || "").slice(0, 10), produit: p ? p.name : "", type: m.type, quantite: m.qty, motif: m.reason, par: UI.employeeName(m.createdBy) }; });
      return [];
    }

    function render() {
      var rows = dataFor(type);
      container.innerHTML =
        UI.pageHeader("Rapports", "Générer des extractions et le dossier de contrôle",
          '<button class="btn btn-secondary no-print" id="dossier">Générer le dossier de contrôle</button>') +

        '<div class="field-row no-print" style="max-width:460px;margin-bottom:16px;">' +
        '<div class="field"><label>Du</label><input type="date" id="r-from" value="' + from + '" /></div>' +
        '<div class="field"><label>Au</label><input type="date" id="r-to" value="' + to + '" /></div>' +
        '</div>' +
        '<div class="page-actions no-print" style="margin-bottom:14px;">' +

      container.querySelectorAll("[data-tab]").forEach(function (b) { b.addEventListener("click", function () { type = b.getAttribute("data-tab"); render(); }); });

      container.querySelector("#r-to").addEventListener("change", function (e) { to = e.target.value; render(); });

      container.querySelector("#print").addEventListener("click", function () { window.print(); });
      container.querySelector("#dossier").addEventListener("click", renderDossier);
    }

    function renderDossier() {

                UI.toast("Document ajouté.", "ok"); UI.closeModal(); render();
              };
              reader.readAsDataURL(file);
            } else {
              DB.add("documents", base, user);
              UI.toast("Document ajouté (sans fichier joint).", "ok"); UI.closeModal(); render();
            }
          });
        }
      });
    }

    render();
  };

  /* ================= JOURNAL D'AUDIT ================= */
  global.Modules.journal = function (container, user) {
    var search = "";
    var filterAction = "";

    function render() {
      var q = search.toLowerCase();
      var rows = DB.Journal.all().filter(function (j) {
        var matchQ = !q || (j.userName + " " + j.entity + " " + (j.note || "")).toLowerCase().indexOf(q) !== -1;
        var matchA = !filterAction || j.action === filterAction;
        return matchQ && matchA;
      }).slice(0, 300);

      container.innerHTML =
        UI.pageHeader("Journal", "Historique complet des actions — preuve en cas de contrôle",
          '<button class="btn btn-secondary" id="export-j">Exporter CSV</button>') +
        '<div class="field-row" style="max-width:520px;margin-bottom:16px;">' +
        UI.searchBar("Rechercher (utilisateur, entité, motif)…", "j-search") +
        '<select id="j-action" class="filter-select"><option value="">Toutes actions</option><option value="create">Création</option><option value="update">Modification</option><option value="delete">Suppression</option><option value="correction">Correction</option><option value="login">Connexion</option><option value="logout">Déconnexion</option></select>' +
        '</div>' +
        UI.card(null, UI.dataTable({
          cols: [
            { key: "at", label: "Date / heure", render: function (j) { return DB.fmtDateTimeFR(j.at); } },
            { key: "userName", label: "Utilisateur" },
            { key: "action", label: "Action", render: function (j) { return UI.pill(j.action, j.action === "delete" ? "bad" : j.action === "create" ? "ok" : "neutral"); } },
            { key: "entity", label: "Entité" },
            { key: "note", label: "Détail", render: function (j) { return UI.esc(j.note ? (typeof j.note === "string" ? j.note : JSON.stringify(j.note)) : ""); } }
          ],
          rows: rows,
          emptyText: "Aucune entrée."
        })) +
        '<div class="hint" style="margin-top:10px;">Affichage limité aux 300 entrées les plus récentes correspondant au filtre. Utilisez l\'export CSV pour une extraction complète.</div>';

      container.querySelector("#j-search").addEventListener("input", function (e) { search = e.target.value; render(); });
      container.querySelector("#j-action").addEventListener("change", function (e) { filterAction = e.target.value; render(); });
      container.querySelector("#export-j").addEventListener("click", function () {
        UI.exportCSV("journal_audit.csv", rows.map(function (j) { return { date: DB.fmtDateTimeFR(j.at), utilisateur: j.userName, action: j.action, entite: j.entity, entite_id: j.entityId || "", detail: j.note ? (typeof j.note === "string" ? j.note : JSON.stringify(j.note)) : "" }; }));
      });
      container.querySelectorAll("table.data-table tbody tr").forEach(function (tr, idx) {
        tr.style.cursor = "pointer";
        tr.addEventListener("click", function () { openDetail(rows[idx]); });
      });
    }

    function openDetail(j) {
      UI.openModal({
        title: "Détail de l'entrée du journal",
        body: '<p style="font-size:13px;"><b>Date :</b> ' + DB.fmtDateTimeFR(j.at) + '</p>' +
          '<p style="font-size:13px;"><b>Utilisateur :</b> ' + UI.esc(j.userName) + '</p>' +
          '<p style="font-size:13px;"><b>Action :</b> ' + j.action + ' — ' + j.entity + (j.entityId ? " (" + j.entityId + ")" : "") + '</p>' +
          (j.oldValue ? '<div class="section-label" style="margin-top:12px;">Ancienne valeur</div><pre style="background:var(--cream);padding:12px;border-radius:8px;font-size:11.5px;overflow:auto;max-height:180px;">' + UI.esc(JSON.stringify(j.oldValue, null, 2)) + '</pre>' : "") +
          (j.newValue ? '<div class="section-label" style="margin-top:12px;">Nouvelle valeur</div><pre style="background:var(--cream);padding:12px;border-radius:8px;font-size:11.5px;overflow:auto;max-height:180px;">' + UI.esc(JSON.stringify(j.newValue, null, 2)) + '</pre>' : ""),
        footer: '<button class="btn btn-secondary" id="close">Fermer</button>',
        onMount: function (overlay) { overlay.querySelector("#close").addEventListener("click", UI.closeModal); }
      });
    }

    render();
  };

  /* ================= PARAMÈTRES ================= */
  global.Modules.settings = function (container, user) {
    function render() {
      var s = DB.all("settings")[0] || {};
      container.innerHTML =
        UI.pageHeader("Paramètres", "Informations boutique, seuils d'alerte et références réglementaires") +
        '<div class="grid-2">' +
        UI.card("Informations boutique", '' +
          '<div class="field"><label>Nom</label><input id="s-name" value="' + UI.esc(s.boutiqueName || "") + '" /></div>' +
          '<div class="field"><label>Adresse</label><input id="s-address" value="' + UI.esc(s.boutiqueAdresse || "") + '" /></div>' +
          '<div class="field"><label>Horaires</label><input id="s-horaires" value="' + UI.esc(s.boutiqueHoraires || "") + '" /></div>' +
          '<div class="field-row"><div class="field"><label>Heure d\'ouverture</label><input type="time" id="s-open" value="' + (s.heuresOuverture || "") + '" /></div><div class="field"><label>Heure de fermeture</label><input type="time" id="s-close" value="' + (s.heuresFermeture || "") + '" /></div></div>'
        ) +
        UI.card("Seuils d'alerte", '' +
          '<div class="field"><label>Alerte DLC (jours avant échéance)</label><input type="number" id="s-dlc" value="' + (s.dlcAlerteJours != null ? s.dlcAlerteJours : 2) + '" /></div>' +
          '<div class="checkbox-row"><input type="checkbox" id="s-stockalert" ' + (s.stockAlerteActive ? "checked" : "") + ' /><label for="s-stockalert">Activer les alertes de stock faible</label></div>'
        ) +
        '</div>' +
        UI.card("Références réglementaires (à valider par un professionnel)", '' +
          '<div class="alert-banner warn">' + UI.severityDot("warn") + '<span>Ces éléments dépendent de l\'activité exacte de l\'établissement. Ne pas les considérer comme définitifs sans validation par l\'expert-comptable, le responsable RH ou le professionnel en charge du PMS/HACCP.</span></div>' +
          '<div class="field"><label>Durées de conservation des données</label><textarea id="s-retention" rows="2">' + UI.esc(s.dataRetentionNote || "") + '</textarea></div>' +
          '<div class="field"><label>Exigences de formation obligatoire</label><textarea id="s-training" rows="2">' + UI.esc(s.trainingRulesNote || "") + '</textarea></div>'
        ) +
        '<div style="text-align:right;margin-top:10px;"><button class="btn btn-primary" id="save-settings">Enregistrer les paramètres</button></div>' +
        '<div class="section-label" style="margin-top:30px;">Sauvegarde des données</div>' +
        UI.card(null, '<p style="font-size:13px;margin:0 0 14px 0;">Exporter une copie complète des données de cet appareil (format JSON), à conserver en lieu sûr.</p><button class="btn btn-secondary" id="backup-btn">Télécharger une sauvegarde complète</button>');

      container.querySelector("#save-settings").addEventListener("click", function () {
        var patch = {
          boutiqueName: container.querySelector("#s-name").value, boutiqueAdresse: container.querySelector("#s-address").value,
          boutiqueHoraires: container.querySelector("#s-horaires").value, heuresOuverture: container.querySelector("#s-open").value,
          heuresFermeture: container.querySelector("#s-close").value, dlcAlerteJours: Number(container.querySelector("#s-dlc").value || 2),
          stockAlerteActive: container.querySelector("#s-stockalert").checked,
          dataRetentionNote: container.querySelector("#s-retention").value, trainingRulesNote: container.querySelector("#s-training").value
        };
        DB.update("settings", s.id, patch, user);
        UI.toast("Paramètres enregistrés.", "ok"); render();
      });
      container.querySelector("#backup-btn").addEventListener("click", function () {
        var cols = ["employees", "equipment", "suppliers", "products", "haccpTemplates", "cleaningTemplates", "settings", "punches", "shifts", "leaves", "haccpLogs", "tempReadings", "cleaningLogs", "anomalies", "receptions", "stockMovements", "inventories", "documents", "trainings", "journal"];
        var dump = {}; cols.forEach(function (c) { dump[c] = DB.all(c); });
        var blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href = url; a.download = "casa-di-mamabella-sauvegarde-" + DB.fmtDate() + ".json";
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        DB.Journal.log(user, "create", "backup", null, null, null, "Export d'une sauvegarde complète");
      });
    }
    render();
  };

  /* ================= CONFIDENTIALITÉ / RGPD ================= */
  global.Modules.privacy = function (container, user) {
    function render() {
      var employees = DB.all("employees");
      container.innerHTML =
        UI.pageHeader("Confidentialité & données personnelles", "Ce que collecte l'application, pourquoi, et qui peut y accéder") +
        UI.card("Données collectées", '' +
          '<p style="font-size:13.5px;line-height:1.7;">Identité et coordonnées professionnelles (nom, poste, téléphone, email) ; code PIN et identifiant de badge personnels (aucune donnée biométrique ni reconnaissance faciale n\'est utilisée, conformément au principe de proportionnalité) ; horodatages de pointage ; contrôles d\'hygiène, relevés de température et tâches de nettoyage réalisés, nominativement associés à la personne qui les effectue ; demandes de congés/absences ; formations suivies.</p>'
        ) +
        UI.card("Finalité", '<p style="font-size:13.5px;line-height:1.7;">Organisation du travail (planning, pointage), preuve de la mise en œuvre du plan de maîtrise sanitaire en cas de contrôle, gestion des ressources humaines de la boutique.</p>') +
        UI.card("Qui peut accéder à quoi", UI.dataTable({
          cols: [{ key: "role", label: "Rôle" }, { key: "acces", label: "Accès" }],
          rows: [
            { id: "admin", role: "Administrateur / Responsable", acces: "Accès complet, y compris données RH sensibles (salaire) et paramètres." },
            { id: "manager", role: "Manager", acces: "Accès opérationnel (équipe, planning, hygiène, stock) sans visibilité sur les salaires ni les paramètres." },
            { id: "salarie", role: "Salarié", acces: "Accès uniquement à son propre espace personnel et à la tablette boutique." }
          ]
        })) +
        UI.card("Durée de conservation", '<p style="font-size:13.5px;line-height:1.7;">' + UI.esc((DB.all("settings")[0] || {}).dataRetentionNote || "À définir.") + ' <a href="#/settings">Modifier dans Paramètres →</a></p>') +
        UI.card("Droits des personnes (accès, rectification, suppression)", '' +
          '<p style="font-size:13.5px;line-height:1.7;margin-bottom:14px;">Toute personne peut demander l\'accès à ses données ou leur rectification auprès du responsable de la boutique. Un export complet des données d\'un salarié peut être généré ci-dessous pour répondre à une demande d\'accès.</p>' +
          '<div class="field" style="max-width:320px;"><label>Exporter les données d\'un salarié</label><select id="priv-emp">' + employees.map(function (e) { return '<option value="' + e.id + '">' + UI.esc(e.firstName + " " + e.lastName) + '</option>'; }).join("") + '</select></div>' +
          '<button class="btn btn-secondary" id="export-emp" style="margin-top:10px;">Générer l\'export</button>'
        );

      container.querySelector("#export-emp").addEventListener("click", function () {
        var empId = container.querySelector("#priv-emp").value;
        var emp = DB.get("employees", empId);
        var dump = {
          identite: emp,
          pointages: DB.all("punches").filter(function (p) { return p.employeeId === empId; }),
          conges: DB.all("leaves").filter(function (l) { return l.employeeId === empId; }),
          formations: DB.all("trainings").filter(function (t) { return t.employeeId === empId; }),
          controles_haccp_realises: DB.all("haccpLogs").filter(function (l) { return l.employeeId === empId; }),
          journal: DB.Journal.all().filter(function (j) { return j.userId === empId; })
        };
        var blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href = url; a.download = "export_donnees_" + (emp ? emp.lastName : empId) + ".json";
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        DB.Journal.log(user, "create", "privacy_export", empId, null, null, "Export RGPD des données de " + (emp ? emp.firstName + " " + emp.lastName : empId));
        UI.toast("Export généré.", "ok");
      });

      container.querySelectorAll('a[href^="#/"]').forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); location.hash = a.getAttribute("href"); }); });
    }
    render();
  };
})(window);

</script>
