<title>Casa di Mamabella — Gestion Boutique</title>
<style>
/* ==========================================================================
   CASA DI MAMABELLA — Gestion Boutique — Design system
   Crème / terracotta, premium, minimaliste, responsive.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Cormorant+Garamond:ital@1&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --cream:#F7F4ED;
  --paper:#FFFFFF;
  --ink:#1C1A17;
  --ink-soft:#6B655A;
  --ink-faint:#9A9184;
  --line:#E7E1D3;
  --line-strong:#D9D0BC;

  --terracotta: oklch(58% 0.11 45);
  --terracotta-dark: oklch(48% 0.11 45);
  --terracotta-soft: oklch(94% 0.025 50);

  --sage: oklch(53% 0.08 150);
  --sage-soft: oklch(94% 0.02 150);

  --amber: oklch(60% 0.13 60);
  --amber-soft: oklch(94% 0.035 70);

  --red: oklch(55% 0.16 25);
  --red-soft: oklch(94% 0.04 25);

  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(28,26,23,0.04);
  --shadow-md: 0 8px 24px rgba(28,26,23,0.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Work Sans', system-ui, sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--terracotta); text-decoration:none;}
a:hover{color:var(--ink);}
button{font-family:inherit;}
.script{font-family:'Cormorant Garamond', serif; font-style:italic;}
.display{font-family:'Space Grotesk', system-ui, sans-serif;}
h1,h2,h3{font-family:'Space Grotesk', system-ui, sans-serif; margin:0;}
img{max-width:100%;}

/* ---------- Layout ---------- */
#app-root{min-height:100vh;}

.app-shell{display:flex; min-height:100vh;}

.sidebar{
  width:250px; flex-shrink:0; background:var(--paper);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:24px 16px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar .logo-wrap{padding:4px 8px 20px 8px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.sidebar .logo-wrap .brand-script{font-size:15px; color:var(--terracotta);}
.sidebar .logo-wrap .brand-name{font-size:17px; font-weight:700; letter-spacing:0.02em;}
.sidebar .logo-wrap .brand-sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}

.nav-group-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); padding:14px 12px 6px 12px;}

.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:var(--ink-soft); background:none; border:none; text-align:left; cursor:pointer;
  font-family:inherit; font-size:13.8px; width:100%; margin-bottom:2px;
}
.nav-item svg{flex-shrink:0;}
.nav-item.active{background:var(--terracotta-soft); color:var(--terracotta); font-weight:600;}
.nav-item:hover:not(.active){background:var(--cream);}
.nav-item .nav-badge{margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700; border-radius:100px; padding:1px 6px; min-width:16px; text-align:center;}

.sidebar-user{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
.sidebar-user .name{font-size:13.5px; font-weight:600;}
.sidebar-user .role{font-size:11.5px; color:var(--ink-soft);}
.sidebar-user .logout-btn{margin-top:10px; width:100%; padding:8px; border-radius:9px; border:1px solid var(--line); background:var(--paper); font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
.sidebar-user .logout-btn:hover{border-color:var(--terracotta); color:var(--terracotta);}

.topbar{
  display:none; align-items:center; justify-content:space-between;
  background:var(--paper); border-bottom:1px solid var(--line);
  padding:12px 16px; position:sticky; top:0; z-index:20;
}
.topbar .brand-name{font-size:15px; font-weight:700;}
.topbar button{background:none; border:none; cursor:pointer; padding:6px;}

main.content{flex:1; padding:34px 42px; min-width:0; max-width:1400px;}

.page-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
.page-header.center{align-items:center;}
.page-header h1{font-size:27px; font-weight:700;}
.page-header .eyebrow{font-size:17px; color:var(--terracotta); margin-bottom:2px;}
.page-header .subtle{font-size:13px; color:var(--ink-soft); margin-top:5px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:100px; padding:10px 18px; font-size:13.5px; font-weight:600;
  border:1px solid transparent; cursor:pointer; white-space:nowrap;
}
.btn-primary{background:var(--terracotta); color:#fff;}
.btn-primary:hover{background:var(--terracotta-dark);}
.btn-secondary{background:var(--paper); color:var(--ink); border-color:var(--line);}
.btn-secondary:hover{border-color:var(--terracotta); color:var(--terracotta);}
.btn-danger{background:var(--red-soft); color:var(--red);}
.btn-danger:hover{background:var(--red); color:#fff;}
.btn-ghost{background:none; color:var(--ink-soft); padding:8px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.5; cursor:not-allowed;}

/* ---------- Cards / tables ---------- */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-pad{padding:22px;}
.section-label{font-size:12.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:12px;}

.stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
.stat-card{flex:1; min-width:170px; padding:16px 18px;}
.stat-card .label{font-size:12px; color:var(--ink-soft);}
.stat-card .num{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; margin-top:4px;}
.stat-card .num.ok{color:var(--sage);}
.stat-card .num.warn{color:var(--amber);}
.stat-card .num.bad{color:var(--red);}

table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.data-table th{
  text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
  color:var(--ink-soft); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.data-table td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr:hover td{background:var(--cream);}
.table-wrap{overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--line); background:var(--paper);}
.table-wrap table{border:none;}
.table-wrap .table-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px; flex-wrap:wrap; border-bottom:1px solid var(--line);}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:100px; white-space:nowrap;}
.pill-ok{color:var(--sage); background:var(--sage-soft);}
.pill-warn{color:var(--amber); background:var(--amber-soft);}
.pill-bad{color:var(--red); background:var(--red-soft);}
.pill-neutral{color:var(--ink-soft); background:var(--cream);}
.dot{width:8px; height:8px; border-radius:100px; display:inline-block;}
.dot-ok{background:var(--sage);}
.dot-warn{background:var(--amber);}
.dot-bad{background:var(--red);}

.avatar{width:34px; height:34px; border-radius:100px; background:var(--terracotta-soft); color:var(--terracotta); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0;}

.empty-state{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

.page-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.stat-card .sub{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
.card-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);}
.card-head h3{font-size:14.5px; font-weight:700;}
.card-head > div{display:flex; gap:8px;}
.card-body{padding:20px;}
.row-actions{display:flex; gap:6px; justify-content:flex-end; white-space:nowrap;}
.row-actions button{background:none; border:none; cursor:pointer; padding:6px; border-radius:7px; color:var(--ink-soft);}
.row-actions button:hover{background:var(--cream); color:var(--terracotta);}
.search-bar{margin-bottom:0;}
.search-bar input{padding:9px 14px; border:1px solid var(--line-strong); border-radius:100px; font-size:13px; min-width:220px; font-family:inherit; background:var(--paper);}
.search-bar input:focus{outline:none; border-color:var(--terracotta);}
.tabs-row{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0;}
.tabs-row button{background:none; border:none; padding:10px 4px; margin-right:20px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; font-family:inherit;}
.tabs-row button.active{color:var(--terracotta); border-bottom-color:var(--terracotta);}
.badge-count{background:var(--red); color:#fff; font-size:10px; font-weight:700; border-radius:100px; padding:1px 6px; margin-left:6px;}
.week-grid{display:grid; grid-template-columns:120px repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; overflow-x:auto;}
.week-grid .wg-cell{background:var(--paper); padding:8px; font-size:12px; min-height:60px;}
.week-grid .wg-head{background:var(--cream); font-weight:700; text-align:center; font-size:11.5px; padding:10px 6px;}
.week-grid .wg-name{background:var(--cream); font-weight:600; display:flex; align-items:center; padding:8px 10px; font-size:12.5px;}
.shift-chip{background:var(--terracotta-soft); color:var(--terracotta-dark); border-radius:7px; padding:4px 6px; font-size:11px; font-weight:600; margin-bottom:4px; cursor:pointer;}
.shift-chip.soir{background:var(--sage-soft); color:var(--sage);}
.wg-add{width:100%; height:100%; min-height:40px; background:none; border:1px dashed var(--line-strong); border-radius:6px; color:var(--ink-faint); cursor:pointer; font-size:16px;}
.wg-add:hover{border-color:var(--terracotta); color:var(--terracotta);}
.diff-box{background:var(--cream); border-radius:10px; padding:10px 14px; font-size:12.5px; margin-top:8px;}
.diff-box .old{color:var(--red); text-decoration:line-through; margin-right:8px;}
.diff-box .new{color:var(--sage); font-weight:600;}
.kpi-mini{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink);}
.field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:9px;
  font-family:inherit; font-size:13.5px; background:var(--paper); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--terracotta);}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.field-row > .field{flex:1; min-width:150px;}
.checkbox-row{display:flex; align-items:center; gap:10px; padding:10px 0;}
.checkbox-row input{width:18px; height:18px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(28,26,23,0.45); display:flex;
  align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{background:var(--paper); border-radius:var(--radius-lg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-md);}
.modal-header{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
.modal-header h3{font-size:17px; font-weight:700;}
.modal-close{background:none; border:none; cursor:pointer; font-size:18px; color:var(--ink-soft); padding:4px;}
.modal-body{padding:22px 24px;}
.modal-footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 24px; border-top:1px solid var(--line);}

/* ---------- Toast ---------- */
#toast-container{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:13px; box-shadow:var(--shadow-md); max-width:320px;}
.toast.toast-ok{background:var(--sage);}
.toast.toast-bad{background:var(--red);}

/* ---------- Login screen ---------- */
.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{width:100%; max-width:400px; background:var(--paper); border-radius:var(--radius-lg); border:1px solid var(--line); box-shadow:var(--shadow-md); padding:36px 32px;}
.login-logo{text-align:center; margin-bottom:22px;}
.login-logo img{width:180px;}
.pin-display{display:flex; gap:10px; justify-content:center; margin:20px 0;}
.pin-dot{width:16px; height:16px; border-radius:100px; border:2px solid var(--line-strong);}
.pin-dot.filled{background:var(--terracotta); border-color:var(--terracotta);}
.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.pin-pad button{
  padding:16px; font-size:19px; font-weight:600; border-radius:12px; border:1px solid var(--line);
  background:var(--cream); cursor:pointer; color:var(--ink);
}
.pin-pad button:hover{border-color:var(--terracotta);}
.pin-pad button.pin-clear{font-size:12px; color:var(--ink-soft);}
.login-error{color:var(--red); font-size:12.5px; text-align:center; margin-top:10px; min-height:16px;}
.login-mode-toggle{display:flex; gap:8px; margin-bottom:22px;}
.login-mode-toggle button{flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.login-mode-toggle button.active{background:var(--terracotta-soft); color:var(--terracotta); border-color:transparent;}
.demo-codes{margin-top:20px; padding:12px 14px; background:var(--cream); border-radius:10px; font-size:11.5px; color:var(--ink-soft); line-height:1.6;}

/* ---------- Tablette kiosque ---------- */
.kiosk-shell{min-height:100vh; background:var(--cream); display:flex; flex-direction:column; align-items:center; padding:30px 20px;}
.kiosk-header{text-align:center; margin-bottom:20px;}
.kiosk-header img{width:150px;}
.kiosk-greeting{font-size:26px; font-weight:700; font-family:'Space Grotesk',sans-serif; text-align:center; margin:10px 0 24px 0;}
.kiosk-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; width:100%; max-width:720px;}
.kiosk-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:28px 16px; border-radius:20px; border:none; cursor:pointer; font-family:inherit;
  font-size:16px; font-weight:700; color:#fff; min-height:130px; text-align:center;
}
.kiosk-btn .kiosk-sub{font-size:12px; font-weight:500; opacity:0.85;}
.kiosk-btn.start{background:var(--sage);}
.kiosk-btn.pause{background:var(--amber);}
.kiosk-btn.resume{background:var(--sage);}
.kiosk-btn.end{background:var(--red);}
.kiosk-btn.neutral{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
.kiosk-btn[disabled]{opacity:0.4; cursor:not-allowed;}
.kiosk-quick{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:100%; max-width:720px; margin-top:20px;}
.kiosk-quick .card{padding:20px; text-align:center; cursor:pointer;}
.kiosk-quick .card:hover{border-color:var(--terracotta);}
.kiosk-footer{margin-top:30px;}
.kiosk-status{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:16px;}

/* ---------- Checklist ---------- */
.checklist-item{display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:var(--paper);}
.checklist-item.done{border-color:var(--sage); background:var(--sage-soft);}
.checklist-item .cl-icon{font-size:22px;}
.checklist-item .cl-label{flex:1; font-size:14.5px; font-weight:600;}
.checklist-check{width:26px; height:26px; border-radius:100px; border:2px solid var(--line-strong); background:var(--paper); cursor:pointer; flex-shrink:0;}
.checklist-check.checked{background:var(--sage); border-color:var(--sage); position:relative;}

/* ---------- Timeline ---------- */
.timeline-item{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px;}
.timeline-item:last-child{border-bottom:none;}
.timeline-item .t-time{color:var(--ink-faint); font-size:11.5px; min-width:44px;}
.timeline-item .t-text b{font-weight:600;}

/* ---------- Alerts banner ---------- */
.alert-banner{display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:12px; font-size:13.5px; margin-bottom:12px;}
.alert-banner.bad{background:var(--red-soft); color:var(--red);}
.alert-banner.warn{background:var(--amber-soft); color:var(--amber);}
.alert-banner.ok{background:var(--sage-soft); color:var(--sage);}

.tag-row{display:flex; gap:8px; flex-wrap:wrap;}
.filter-select{padding:8px 10px; border:1px solid var(--line-strong); border-radius:8px; font-size:12.5px; background:var(--paper);}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}

/* ---------- Responsive ---------- */
@media (max-width:1080px){
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
}
@media (max-width:860px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  main.content{padding:20px;}
  .grid-3{grid-template-columns:1fr;}
  .kiosk-grid{grid-template-columns:1fr;}
  .kiosk-quick{grid-template-columns:1fr;}
}
@media (max-width:860px){
  .sidebar.mobile-open{
    display:flex; position:fixed; inset:0 20% 0 0; z-index:50; height:100vh; box-shadow:var(--shadow-md);
  }
  .sidebar-backdrop{display:none;}
  .sidebar.mobile-open + .sidebar-backdrop{display:block; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:40;}
}

@media print{
  .sidebar, .topbar, .btn, .no-print{display:none !important;}
  main.content{padding:0; max-width:100%;}
  body{background:#fff;}
}

</style>

<script>
/* ==== js/db.js ==== */
/* ==========================================================================
   CASA DI MAMABELLA — Gestion Boutique
   db.js — Couche de données locale (stockage navigateur) + journal d'audit
   --------------------------------------------------------------------------
   IMPORTANT (à lire) :
   Cette version stocke les données dans le navigateur de l'appareil
   (localStorage). C'est un vrai système fonctionnel (CRUD réel, calculs
   réels, historique réel) mais LOCAL À CET APPAREIL : il n'y a pas encore
   de serveur central qui synchronise automatiquement la tablette boutique,
   le téléphone du responsable et l'ordinateur du comptable entre eux.
   Pour une exploitation multi-appareils en production, il faudra brancher
   cette couche sur une vraie base de données serveur (voir README.md).
   ========================================================================== */

(function (global) {
  "use strict";

  var PREFIX = "cdmb_";
  var SEED_FLAG = PREFIX + "seeded_v1";

  function uid() {
    return Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
  }

  function nowISO() {
    return new Date().toISOString();
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function fmtDate(d) {
    d = d ? new Date(d) : new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function fmtTime(d) {
    d = d ? new Date(d) : new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtDateFR(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
  }
  function fmtDateTimeFR(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return fmtDateFR(iso) + " à " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function readCol(col) {
    try {
      return JSON.parse(localStorage.getItem(PREFIX + col) || "[]");
    } catch (e) {
      console.error("DB read error", col, e);
      return [];
    }
  }
  function writeCol(col, arr) {
    localStorage.setItem(PREFIX + col, JSON.stringify(arr));
  }

  /* ---------------- Journal d'audit ---------------- */
  var Journal = {
    log: function (user, action, entity, entityId, oldValue, newValue, extra) {
      var arr = readCol("journal");
      arr.push({
        id: uid(),
        at: nowISO(),
        userId: user ? user.id : null,
        userName: user ? (user.firstName + " " + user.lastName) : "Système",
        action: action, // create | update | delete | login | logout | correction
        entity: entity, // ex: employees, punches, tempReadings...
        entityId: entityId || null,

        note: extra || null
      });
      // Le journal ne doit jamais être tronqué silencieusement.
      writeCol("journal", arr);
    },

      var arr = readCol(col);
      var item = Object.assign(
        { id: uid(), createdAt: nowISO(), createdBy: user ? user.id : null },
        obj
      );
      arr.push(item);
      writeCol(col, arr);
      if (!opts || !opts.silent) {
        Journal.log(user, "create", col, item.id, null, item);
      }
      return item;
    },
    update: function (col, id, patch, user, opts) {
      var arr = readCol(col);
      var idx = arr.findIndex(function (x) { return x.id === id; });

      var old = Object.assign({}, arr[idx]);
      var updated = Object.assign({}, arr[idx], patch, {

        updatedBy: user ? user.id : null
      });
      arr[idx] = updated;

      var old = arr[idx];
      arr.splice(idx, 1);
      writeCol(col, arr);

/* ==========================================================================
   auth.js — Authentification par code PIN (sans biométrie / reconnaissance
   faciale, conformément au principe de proportionnalité rappelé par la
   CNIL pour les dispositifs de contrôle du temps de travail).
   Session stockée dans sessionStorage (effacée à la fermeture de l'onglet).
   ========================================================================== */

(function (global) {
  "use strict";

  var SESSION_KEY = "cdmb_session";

  var Auth = {
    PERMISSIONS: {
      admin: { routes: "*", canSeeSalary: true, canManageUsers: true, canManageSettings: true },
      responsable: { routes: "*", canSeeSalary: true, canManageUsers: true, canManageSettings: true },
      manager: {
        routes: ["dashboard", "team", "planning", "pointage", "leaves", "haccp", "temperatures",
          "cleaning", "traceability", "stock", "suppliers", "reports", "documents", "trainings",
          "alerts", "tablet"],
        canSeeSalary: false, canManageUsers: false, canManageSettings: false
      },
      salarie: {
        routes: ["myspace", "tablet"],
        canSeeSalary: false, canManageUsers: false, canManageSettings: false
      }
    },

    getUser: function () {
      try {
        var raw = sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },

    login: function (pin) {
      var employees = DB.all("employees");
      var match = employees.find(function (e) { return e.pin === pin && e.statut !== "inactif"; });
      if (!match) return { ok: false, error: "Code incorrect. Vérifiez votre code personnel." };
      var session = {
        id: match.id, firstName: match.firstName, lastName: match.lastName,
        role: match.role, poste: match.poste, loginAt: DB.nowISO()
      };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      DB.Journal.log(session, "login", "session", match.id, null, { device: (global.CDMB_DEVICE || "web") });
      return { ok: true, user: session };
    },

    logout: function () {
      var user = this.getUser();
      if (user) DB.Journal.log(user, "logout", "session", user.id, null, null);
      sessionStorage.removeItem(SESSION_KEY);
    },

    can: function (route) {
      var user = this.getUser();
      if (!user) return false;
      var perm = this.PERMISSIONS[user.role];
      if (!perm) return false;
      if (perm.routes === "*") return true;
      return perm.routes.indexOf(route) !== -1;
    },

    canSeeSalary: function () {
      var user = this.getUser();
      if (!user) return false;
      var perm = this.PERMISSIONS[user.role];
      return !!(perm && perm.canSeeSalary);
    },

    isAdminLike: function () {
      var user = this.getUser();
      return !!user && (user.role === "admin" || user.role === "responsable" || user.role === "manager");
    }
  };

  global.Auth = Auth;
})(window);

  UI.exportCSV = function (filename, rows) {

    var cols = Object.keys(rows[0]);
    var lines = [cols.join(";")];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) {
        var v = r[c] === null || r[c] === undefined ? "" : String(r[c]);
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(";"));
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();

  /* ---------------- Notifications / alertes calculées ---------------- */
  var Notifications = {
    compute: function () {
      var out = [];
      var today = DB.fmtDate();
      var settings = DB.all("settings")[0] || {};

      // Températures non conformes récentes
      DB.all("tempReadings").filter(function (r) { return r.conform === false; }).forEach(function (r) {
        var eq = DB.get("equipment", r.equipmentId);
        out.push({ severity: "bad", text: "Température non conforme — " + (eq ? eq.name : "équipement") + " : " + r.value + "°C", route: "temperatures", at: r.date + " " + r.time });
      });

      // Stock faible / rupture
      DB.all("products").forEach(function (p) {
        if (p.stockCurrent <= 0) out.push({ severity: "bad", text: "Rupture de stock — " + p.name, route: "stock", at: today });
        else if (p.stockCurrent <= p.stockMin) out.push({ severity: "warn", text: "Stock faible — " + p.name + " (" + p.stockCurrent + " restants)", route: "stock", at: today });
        if (p.dlc) {
          var days = Math.ceil((new Date(p.dlc) - new Date(today)) / 86400000);
          if (days <= (settings.dlcAlerteJours || 2) && days >= 0) {
            out.push({ severity: "warn", text: "DLC proche — " + p.name + " (dans " + days + " j.)", route: "stock", at: today });
          } else if (days < 0) {
            out.push({ severity: "bad", text: "DLC dépassée — " + p.name, route: "stock", at: today });
          }
        }
      });

      // Anomalies ouvertes
      DB.all("anomalies").filter(function (a) { return a.status !== "resolu"; }).forEach(function (a) {
        out.push({ severity: "bad", text: "Anomalie #" + a.number + " à traiter — " + a.description, route: "alerts", at: a.detectedAt });
      });

      // Tâches HACCP non faites aujourd'hui (par fréquence quotidienne)
      var doneToday = DB.all("haccpLogs").filter(function (l) { return l.date === today; }).map(function (l) { return l.templateId; });
      DB.all("haccpTemplates").filter(function (t) { return t.frequency === "quotidien"; }).forEach(function (t) {
        if (doneToday.indexOf(t.id) === -1) out.push({ severity: "warn", text: "Contrôle HACCP non réalisé — " + t.name, route: "haccp", at: today });
      });

      // Nettoyage non fait aujourd'hui (fréquence quotidienne)
      var cleanDoneToday = DB.all("cleaningLogs").filter(function (l) { return l.date === today; }).map(function (l) { return l.templateId; });
      DB.all("cleaningTemplates").filter(function (t) { return t.frequency === "quotidien"; }).forEach(function (t) {
        if (cleanDoneToday.indexOf(t.id) === -1) out.push({ severity: "warn", text: "Nettoyage non réalisé — " + t.name, route: "cleaning", at: today });
      });

      // Formations proches échéance / expirées
      DB.all("trainings").forEach(function (tr) {
        if (!tr.expiryDate) return;
        var days = Math.ceil((new Date(tr.expiryDate) - new Date(today)) / 86400000);
        if (days < 0) out.push({ severity: "bad", text: "Formation expirée — " + tr.name + " (" + UI.employeeName(tr.employeeId) + ")", route: "trainings", at: today });
        else if (days <= 30) out.push({ severity: "warn", text: "Formation arrive à échéance — " + tr.name + " (" + UI.employeeName(tr.employeeId) + ", " + days + " j.)", route: "trainings", at: today });
      });

      // Retards (arrivée constatée après début planifié, aujourd'hui)
      var todayShifts = DB.all("shifts").filter(function (s) { return s.date === today; });
      var todayPunches = DB.all("punches").filter(function (p) { return p.type === "arrivee" && p.timestamp.slice(0, 10) === today; });
      todayShifts.forEach(function (s) {
        var punch = todayPunches.find(function (p) { return p.employeeId === s.employeeId; });
        if (punch) {
          var arr = new Date(punch.timestamp);
          var expected = new Date(today + "T" + s.start + ":00");
          if (arr - expected > 10 * 60000) {
            out.push({ severity: "warn", text: "Retard — " + UI.employeeName(s.employeeId) + " (" + Math.round((arr - expected) / 60000) + " min)", route: "pointage", at: today });
          }
        }
      });

      return out;
    }
  };

  function render() {
    var root = document.getElementById("app-root");
    var user = Auth.getUser();
    var r = route();

    if (!user) {
      if (r.name !== "login" && r.name !== "tablet-kiosk") {
        location.hash = "#/login";
        return;
      }
    }

    if (r.name === "login" || r.name === "") {

      root.innerHTML = '<div id="login-mount"></div>';
      Modules.login(document.getElementById("login-mount"));

      root.innerHTML = '<div id="kiosk-mount"></div>';
      Modules["tablet-kiosk"](document.getElementById("kiosk-mount"));
      return;

  /* ---------------- Logique métier partagée (utilisée par plusieurs modules) ---------------- */
  var Domain = {
    // Numérotation officielle des anomalies : ANM-<année>-<n° séquentiel sur 4 chiffres>
    nextAnomalyNumber: function () {
      var year = new Date().getFullYear();
      var count = DB.all("anomalies").filter(function (a) { return (a.number || "").indexOf("ANM-" + year) === 0; }).length;
      return "ANM-" + year + "-" + String(count + 1).padStart(4, "0");
    },
    // Détermine la conformité d'un relevé de température par rapport aux bornes de l'équipement.
    checkTempConform: function (equipment, value) {
      if (!equipment) return true;
      return value >= equipment.minTemp && value <= equipment.maxTemp;
    },
    // Enregistre un relevé de température et ouvre automatiquement une anomalie si non conforme.
    recordTempReading: function (equipment, value, user, device) {
      var conform = Domain.checkTempConform(equipment, value);
      var reading = DB.add("tempReadings", {
        equipmentId: equipment.id, value: value, date: DB.fmtDate(), time: DB.fmtTime(),
        by: user ? user.id : null, conform: conform, device: device || "web"
      }, user);
      if (!conform) {
        DB.add("anomalies", {
          number: Domain.nextAnomalyNumber(),
          source: "temperature", refId: reading.id,
          description: "Température non conforme sur " + equipment.name + " : " + value + "°C (plage attendue " + equipment.minTemp + "°C à " + equipment.maxTemp + "°C)",
          severity: "bad", status: "ouverte",
          detectedAt: DB.nowISO(), detectedBy: user ? user.id : null,
          correctiveAction: "", correctiveActionBy: null, correctiveActionAt: null
        }, user);
      }
      return reading;
    },
    todayPunchState: function (employeeId) {
      var today = DB.fmtDate();
      var punches = DB.all("punches").filter(function (p) {
        return p.employeeId === employeeId && p.timestamp.slice(0, 10) === today;
      }).sort(function (a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });
      var last = punches.length ? punches[punches.length - 1] : null;
      var state = last ? last.type : "aucun";
      return {
        punches: punches, last: last, state: state,
        canStart: state === "aucun",
        canPause: state === "arrivee" || state === "reprise",
        canResume: state === "pause",
        canEnd: state === "arrivee" || state === "reprise" || state === "pause"
      };
    },
    workedHoursToday: function (employeeId) {
      var st = Domain.todayPunchState(employeeId);
      var ms = 0, startAt = null;
      st.punches.forEach(function (p) {
        var t = new Date(p.timestamp).getTime();
        if (p.type === "arrivee" || p.type === "reprise") startAt = t;
        else if ((p.type === "pause" || p.type === "depart") && startAt !== null) { ms += t - startAt; startAt = null; }
      });
      if (startAt !== null) ms += Date.now() - startAt;
      return ms / 3600000;
    }
  };

  global.CDMB = { render: render, route: route, NAV: NAV };

        '<div class="login-mode-toggle">' +
        '<button data-mode="pin" class="' + (mode === "pin" ? "active" : "") + '">Code PIN</button>' +
        '<button data-mode="badge" class="' + (mode === "badge" ? "active" : "") + '">Badge / QR code</button>' +
        '</div>' +
        (mode === "pin" ? '' +
          '<div id="pin-display" class="pin-display"></div>' +
          '<div class="pin-pad">' +
          [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-digit="' + n + '">' + n + '</button>'; }).join("") +
          '<button class="pin-clear" data-action="clear">Effacer</button>' +
          '<button data-digit="0">0</button>' +
          '<button class="pin-clear" data-action="back">⌫</button>' +
          '</div>'
          : '' +
          '<div class="field"><label>Numéro de badge ou code scanné</label>' +
          '<input type="text" id="badge-input" placeholder="ex. BADGE-1234" autocomplete="off" />' +
          '<div class="hint">Sans lecteur NFC/QR connecté, saisissez ici le code imprimé sur le badge.</div></div>' +
          '<button class="btn btn-primary btn-block" id="badge-submit">Valider</button>'
        ) +
        '<div id="login-err" class="login-error"></div>' +
        '<div class="demo-codes"><b>Comptes de démonstration</b> (à retirer avant mise en production réelle) :<br/>' +
        'Administrateur — 0000 · Responsable — 1234 · Manager — 3333 · Salarié — 1111 / 2222</div>' +
        '<div style="text-align:center;margin-top:18px;">' +
        '<a href="#/tablet-kiosk" style="font-size:12.5px;">Ouvrir l\'interface tablette boutique →</a>' +
        '</div>' +
        '</div></div>';
    }

    function mount() {
      container.innerHTML = html();
      renderPinDots();

      container.querySelectorAll("[data-mode]").forEach(function (b) {
        b.addEventListener("click", function () { mode = b.getAttribute("data-mode"); pin = ""; mount(); });
      });

      if (mode === "pin") {
        container.querySelectorAll("[data-digit]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (pin.length >= 4) return;
            pin += b.getAttribute("data-digit");
            renderPinDots();
            if (pin.length === 4) setTimeout(tryLoginPin, 120);
          });
        });
        var clearBtn = container.querySelector('[data-action="clear"]');
        if (clearBtn) clearBtn.addEventListener("click", function () { pin = ""; renderPinDots(); });
        var backBtn = container.querySelector('[data-action="back"]');
        if (backBtn) backBtn.addEventListener("click", function () { pin = pin.slice(0, -1); renderPinDots(); });
      } else {
        var input = container.querySelector("#badge-input");
        var submit = container.querySelector("#badge-submit");
        function submitBadge() {
          var code = input.value || "";
          var emp = findByBadge(code);
          var err = container.querySelector("#login-err");
          if (!emp) { if (err) err.textContent = "Badge non reconnu."; return; }
          var res = Auth.login(emp.pin);
          if (res.ok) goAfterLogin(res.user);
          else if (err) err.textContent = res.error;
        }
        submit.addEventListener("click", submitBadge);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") submitBadge(); });
      }
    }

    mount();
  };
})(window);

      function dots() {
        var wrap = container.querySelector("#pin-display");
        var html = "";
        for (var i = 0; i < 4; i++) html += '<div class="pin-dot ' + (i < pin.length ? "filled" : "") + '"></div>';
        wrap.innerHTML = html;
      }
      dots();
      container.querySelectorAll("[data-digit]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (pin.length >= 4) return;
          pin += b.getAttribute("data-digit"); dots();
          if (pin.length === 4) {
            setTimeout(function () {
              var emp = DB.all("employees").find(function (e) { return e.pin === pin && e.statut !== "inactif"; });
              if (!emp) {
                container.querySelector("#ident-err").textContent = "Code non reconnu.";
                pin = ""; dots();
                return;
              }
              current = emp;
              DB.Journal.log(pseudoUser(emp), "login", "kiosk", emp.id, null, { device: "tablette-boutique" });
              renderHub();
            }, 120);
          }
        });
      });
      container.querySelector('[data-action="clear"]').addEventListener("click", function () { pin = ""; dots(); });

    /* ---------------- Confirmation courte puis retour automatique ---------------- */
    function showConfirmAndReturn(message, tone) {
      container.innerHTML =
        '<div class="kiosk-shell"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">' +
        '<div class="alert-banner ' + (tone || "ok") + '" style="font-size:18px;padding:22px 30px;">' + message + '</div>' +
        '<div class="kiosk-status">Retour à l\'écran d\'identification…</div>' +
        '</div></div>';
      returnTimer = setTimeout(function () { current = null; renderIdent(); }, 2200);
    }

      container.addEventListener("click", armIdle);

      container.querySelector("#k-start").addEventListener("click", function () {
        if (!st.canStart) return;

      container.querySelector("#k-pause").addEventListener("click", function () {
        if (!st.canPause) return;
        DB.add("punches", { employeeId: current.id, type: "pause", timestamp: DB.nowISO(), device: "tablette-boutique", corrections: [] }, pseudoUser(current));
        showConfirmAndReturn("⏸ Pause enregistrée — " + DB.fmtTime(), "warn");
      });
      container.querySelector("#k-resume").addEventListener("click", function () {
        if (!st.canResume) return;

      });

    /* ---------------- Checklist hygiène (contrôles HACCP quotidiens) ---------------- */
    function openHygieneChecklist() {
      var today = DB.fmtDate();
      var templates = DB.all("haccpTemplates").filter(function (t) { return t.frequency === "quotidien"; });
      var doneIds = DB.all("haccpLogs").filter(function (l) { return l.date === today; }).map(function (l) { return l.templateId; });

      function body() {
        return templates.map(function (t) {
          var done = doneIds.indexOf(t.id) !== -1;
          return '<div class="checklist-item ' + (done ? "done" : "") + '" data-tid="' + t.id + '">' +
            '<div class="cl-icon">' + (done ? "✅" : "⬜") + '</div>' +
            '<div class="cl-label">' + UI.esc(t.name) + '<div class="kiosk-sub" style="color:var(--ink-soft);font-weight:400;">Prévu : ' + UI.esc(t.expectedTime) + '</div></div>' +
            '<button class="checklist-check ' + (done ? "checked" : "") + '" data-tid="' + t.id + '"></button>' +
            '</div>';
        }).join("");
      }

      var m = UI.openModal({
        title: "Contrôle hygiène du jour",
        body: '<div id="hg-list">' + body() + '</div>',
        footer: '<button class="btn btn-primary" id="hg-close">Terminer</button>',
        onMount: function (overlay) {
          overlay.querySelector("#hg-close").addEventListener("click", function () { UI.closeModal(); renderHub(); });
          function wire() {
            overlay.querySelectorAll(".checklist-check").forEach(function (b) {
              b.addEventListener("click", function () {
                var tid = b.getAttribute("data-tid");
                if (doneIds.indexOf(tid) !== -1) return;
                DB.add("haccpLogs", { templateId: tid, date: today, time: DB.fmtTime(), employeeId: current.id, ok: true, comment: "" }, pseudoUser(current));
                doneIds.push(tid);
                overlay.querySelector("#hg-list").innerHTML = body();
                wire();
              });
            });
          }
          wire();
        }
      });
      armIdle();
    }

    /* ---------------- Relevé de température rapide ---------------- */
    function openTempQuick() {
      var equipment = DB.all("equipment");
      UI.openModal({
        title: "Relevé de température",
        body: equipment.map(function (eq) {
          return '<div class="field"><label>' + UI.esc(eq.name) + ' <span class="hint">(plage attendue ' + eq.minTemp + '°C à ' + eq.maxTemp + '°C)</span></label>' +
            '<div style="display:flex;gap:8px;"><input type="number" step="0.1" id="t_' + eq.id + '" placeholder="°C" style="flex:1;" />' +
            '<button class="btn btn-primary" data-eq="' + eq.id + '">Enregistrer</button></div></div>';
        }).join(""),
        footer: '<button class="btn btn-secondary" id="t-close">Fermer</button>',
        onMount: function (overlay) {
          overlay.querySelector("#t-close").addEventListener("click", function () { UI.closeModal(); renderHub(); });
          overlay.querySelectorAll("[data-eq]").forEach(function (b) {
            b.addEventListener("click", function () {
              var eqId = b.getAttribute("data-eq");
              var input = overlay.querySelector("#t_" + eqId);
              var val = parseFloat(input.value);
              if (isNaN(val)) { UI.toast("Saisissez une valeur.", "bad"); return; }
              var eq = DB.get("equipment", eqId);
              var reading = Domain.recordTempReading(eq, val, pseudoUser(current), "tablette-boutique");
              if (reading.conform) UI.toast("Relevé conforme enregistré.", "ok");
              else UI.toast("⚠ Non conforme — anomalie créée automatiquement.", "bad");
              input.value = "";
            });
          });
        }
      });
      armIdle();
    }

    /* ---------------- Nettoyage rapide ---------------- */
    function openCleaningChecklist() {
      var today = DB.fmtDate();
      var templates = DB.all("cleaningTemplates").filter(function (t) { return t.frequency === "quotidien"; });
      var doneIds = DB.all("cleaningLogs").filter(function (l) { return l.date === today; }).map(function (l) { return l.templateId; });

      function body() {
        return templates.map(function (t) {
          var done = doneIds.indexOf(t.id) !== -1;
          return '<div class="checklist-item ' + (done ? "done" : "") + '" data-tid="' + t.id + '">' +
            '<div class="cl-icon">' + (done ? "✅" : "⬜") + '</div>' +
            '<div class="cl-label">' + UI.esc(t.name) + '<div class="kiosk-sub" style="color:var(--ink-soft);font-weight:400;">' + UI.esc(t.procedure) + '</div></div>' +
            '<button class="checklist-check ' + (done ? "checked" : "") + '" data-tid="' + t.id + '"></button>' +
            '</div>';
        }).join("");
      }

      var overlayRef = UI.openModal({
        title: "Nettoyage — checklist du jour",
        body: '<div id="cl-list">' + body() + '</div>',
        footer: '<button class="btn btn-primary" id="cl-close">Terminer</button>',
        onMount: function (overlay) {
          overlay.querySelector("#cl-close").addEventListener("click", function () { UI.closeModal(); renderHub(); });
          function wire() {
            overlay.querySelectorAll(".checklist-check").forEach(function (b) {
              b.addEventListener("click", function () {
                var tid = b.getAttribute("data-tid");
                if (doneIds.indexOf(tid) !== -1) return;
                DB.add("cleaningLogs", { templateId: tid, date: today, time: DB.fmtTime(), employeeId: current.id }, pseudoUser(current));
                doneIds.push(tid);
                overlay.querySelector("#cl-list").innerHTML = body();
                wire();
              });
            });
          }
          wire();
        }
      });
      armIdle();
    }

    /* ---------------- Réception marchandise rapide ---------------- */
    function openReceptionQuick() {
      var suppliers = DB.all("suppliers");
      UI.openModal({
        title: "Réception marchandise",
        body: '' +
          '<div class="field"><label>Fournisseur</label><select id="rc-supplier">' +
          suppliers.map(function (s) { return '<option value="' + s.id + '">' + UI.esc(s.name) + '</option>'; }).join("") +
          '</select></div>' +
          '<div class="field"><label>Produit / lot livré</label><input type="text" id="rc-product" placeholder="ex. Burrata 250g — lot L2026-091" /></div>' +
          '<div class="field-row"><div class="field"><label>Quantité</label><input type="number" id="rc-qty" /></div>' +
          '<div class="field"><label>Température à réception (°C, si applicable)</label><input type="number" step="0.1" id="rc-temp" /></div></div>' +
          '<div class="field"><label>Conformité de la livraison</label><select id="rc-conform"><option value="true">Conforme</option><option value="false">Non conforme</option></select></div>' +
          '<div class="field"><label>Observations</label><textarea id="rc-note" rows="2"></textarea></div>',
        footer: '<button class="btn btn-secondary" id="rc-cancel">Annuler</button><button class="btn btn-primary" id="rc-save">Enregistrer la réception</button>',
        onMount: function (overlay) {
          overlay.querySelector("#rc-cancel").addEventListener("click", function () { UI.closeModal(); renderHub(); });
          overlay.querySelector("#rc-save").addEventListener("click", function () {
            var conform = overlay.querySelector("#rc-conform").value === "true";
            var rec = DB.add("receptions", {
              supplierId: overlay.querySelector("#rc-supplier").value,
              productLabel: overlay.querySelector("#rc-product").value,
              quantity: overlay.querySelector("#rc-qty").value,
              tempAtReception: overlay.querySelector("#rc-temp").value || null,
              conform: conform,
              note: overlay.querySelector("#rc-note").value,
              date: DB.fmtDate(), time: DB.fmtTime()
            }, pseudoUser(current));
            if (!conform) {
              DB.add("anomalies", {
                number: Domain.nextAnomalyNumber(), source: "reception", refId: rec.id,
                description: "Réception non conforme — " + rec.productLabel, severity: "warn", status: "ouverte",
                detectedAt: DB.nowISO(), detectedBy: current.id, correctiveAction: "", correctiveActionBy: null, correctiveActionAt: null
              }, pseudoUser(current));
            }
            UI.closeModal();
            UI.toast("Réception enregistrée.", "ok");
            renderHub();
          });
        }
      });
      armIdle();
    }

    renderIdent();
  };
})(window);


/* ==== js/modules-dashboard.js ==== */
/* ==========================================================================
   modules-dashboard.js — Tableau de bord : indicateurs calculés en direct
   à partir des données réelles (présence, HACCP, températures, nettoyage,
   stock, DLC, anomalies) + fil d'activité (journal d'audit).
   ========================================================================== */

(function (global) {
  "use strict";

  function journalLine(entry) {
    var actionLabels = {
      create: "a créé", update: "a modifié", delete: "a supprimé",
      login: "s'est connecté(e)", logout: "s'est déconnecté(e)", correction: "a corrigé"
    };
    var entityLabels = {
      employees: "une fiche employé", punches: "un pointage", shifts: "un créneau planning",
      leaves: "une demande de congé", trainings: "une formation", haccpLogs: "un contrôle HACCP",
      tempReadings: "un relevé de température", cleaningLogs: "un nettoyage", anomalies: "une anomalie",
      products: "un produit", stockMovements: "un mouvement de stock", receptions: "une réception",
      suppliers: "un fournisseur", documents: "un document", settings: "les paramètres",
      session: "une session", system: "le système"
    };
    var txt = "<b>" + UI.esc(entry.userName) + "</b> " + (actionLabels[entry.action] || entry.action) +
      " " + (entityLabels[entry.entity] || entry.entity);
    return '<div class="timeline-item"><div class="t-time">' + entry.at.slice(11, 16) + '</div><div class="t-text">' + txt + '</div></div>';
  }

  global.Modules.dashboard = function (container, user) {
    var today = DB.fmtDate();
    var employees = DB.all("employees").filter(function (e) { return e.statut !== "inactif"; });
    var shiftsToday = DB.all("shifts").filter(function (s) { return s.date === today; });
    var punchesToday = DB.all("punches").filter(function (p) { return p.timestamp.slice(0, 10) === today; });
    var arrivedIds = punchesToday.filter(function (p) { return p.type === "arrivee"; }).map(function (p) { return p.employeeId; });
    var present = shiftsToday.filter(function (s) { return arrivedIds.indexOf(s.employeeId) !== -1; }).length;

    var notifs = Notifications.compute();
    var lateCount = notifs.filter(function (n) { return n.text.indexOf("Retard") === 0; }).length;

    var totalHeures = 0;
    arrivedIds.forEach(function (id) { totalHeures += Domain.workedHoursToday(id); });

    var haccpTemplatesToday = DB.all("haccpTemplates").filter(function (t) { return t.frequency === "quotidien"; });
    var haccpDoneToday = DB.all("haccpLogs").filter(function (l) { return l.date === today; }).map(function (l) { return l.templateId; });
    var haccpPct = haccpTemplatesToday.length ? Math.round(100 * haccpDoneToday.filter(function (id) { return haccpTemplatesToday.some(function (t) { return t.id === id; }); }).length / haccpTemplatesToday.length) : 100;

    var cleanTemplatesToday = DB.all("cleaningTemplates").filter(function (t) { return t.frequency === "quotidien"; });
    var cleanDoneToday = DB.all("cleaningLogs").filter(function (l) { return l.date === today; }).map(function (l) { return l.templateId; });
    var cleanPct = cleanTemplatesToday.length ? Math.round(100 * cleanDoneToday.filter(function (id) { return cleanTemplatesToday.some(function (t) { return t.id === id; }); }).length / cleanTemplatesToday.length) : 100;

    var tempReadingsToday = DB.all("tempReadings").filter(function (r) { return r.date === today; });
    var tempNonConform = tempReadingsToday.filter(function (r) { return r.conform === false; }).length;

    var products = DB.all("products");
    var stockLow = products.filter(function (p) { return p.stockCurrent > 0 && p.stockCurrent <= p.stockMin; }).length;
    var stockRupture = products.filter(function (p) { return p.stockCurrent <= 0; }).length;
    var dlcSoon = products.filter(function (p) {
      if (!p.dlc) return false;
      var days = Math.ceil((new Date(p.dlc) - new Date(today)) / 86400000);
      return days <= 2;
    }).length;

    var anomaliesOpen = DB.all("anomalies").filter(function (a) { return a.status !== "resolu"; }).length;

    function progressBar(pct, tone) {
      return '<div style="background:var(--cream);border-radius:100px;height:8px;overflow:hidden;margin-top:8px;">' +
        '<div style="background:var(--' + tone + ');height:100%;width:' + pct + '%;"></div></div>';
    }

    var alertsHtml = notifs.slice(0, 6).map(function (n) {
      return '<div class="alert-banner ' + n.severity + '" style="cursor:pointer;" data-route="' + n.route + '">' +
        UI.severityDot(n.severity) + '<span>' + UI.esc(n.text) + '</span></div>';
    }).join("") || '<div class="alert-banner ok">' + UI.severityDot("ok") + '<span>Aucune alerte en cours — tout est en ordre.</span></div>';

    var timelineHtml = DB.Journal.all().slice(0, 14).map(journalLine).join("") || UI.emptyState("Aucune activité enregistrée.");

    container.innerHTML =
      UI.pageHeader("Tableau de bord", DB.fmtDateFR(new Date().toISOString()) + " — " + (DB.all("settings")[0] || {}).boutiqueName,
        '<button class="btn btn-secondary" id="db-refresh">Actualiser</button>') +

      '<div class="stat-row">' +
      UI.statCard("Présence", present + " / " + shiftsToday.length, present >= shiftsToday.length ? "ok" : "warn", "employés arrivés aujourd'hui") +
      UI.statCard("Retards", lateCount, lateCount ? "warn" : "ok", "aujourd'hui") +
      UI.statCard("Heures travaillées", totalHeures.toFixed(1) + " h", "", "cumul du jour") +
      UI.statCard("Anomalies ouvertes", anomaliesOpen, anomaliesOpen ? "bad" : "ok", "à traiter") +
      '</div>' +

      '<div class="stat-row">' +
      UI.statCard("Stock faible / rupture", stockLow + " / " + stockRupture, (stockRupture ? "bad" : (stockLow ? "warn" : "ok")), "produits") +
      UI.statCard("DLC proches (≤2j)", dlcSoon, dlcSoon ? "warn" : "ok", "produits") +
      UI.statCard("Températures non conformes", tempNonConform, tempNonConform ? "bad" : "ok", tempReadingsToday.length + " relevé(s) aujourd'hui") +
      '</div>' +

      '<div class="grid-2">' +
      '<div>' +
      '<div class="section-label">Alertes en cours</div>' +
      alertsHtml +
      '<div class="section-label" style="margin-top:26px;">Activité récente</div>' +
      UI.card(null, timelineHtml) +
      '</div>' +
      '<div>' +
      '<div class="section-label">Avancement du jour</div>' +
      UI.card(null,
        '<div style="margin-bottom:20px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>Contrôles HACCP quotidiens</span><b>' + haccpPct + '%</b></div>' + progressBar(haccpPct, haccpPct === 100 ? "sage" : "amber") + '</div>' +
        '<div style="margin-bottom:20px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>Nettoyage quotidien</span><b>' + cleanPct + '%</b></div>' + progressBar(cleanPct, cleanPct === 100 ? "sage" : "amber") + '</div>' +
        '<div><div style="display:flex;justify-content:space-between;font-size:13px;"><span>Relevés de température</span><b>' + tempReadingsToday.length + '</b></div>' + progressBar(Math.min(100, tempReadingsToday.length * 34), tempNonConform ? "red" : "sage") + '</div>'
      ) +
      '<div class="section-label" style="margin-top:26px;">Équipe</div>' +
      UI.card(null,
        employees.slice(0, 6).map(function (e) {
          var isIn = arrivedIds.indexOf(e.id) !== -1;
          return '<div class="timeline-item"><div style="display:flex;align-items:center;gap:10px;flex:1;">' + UI.avatar(e.id) +
            '<div><div style="font-weight:600;font-size:13px;">' + UI.esc(e.firstName + " " + e.lastName) + '</div><div style="font-size:11.5px;color:var(--ink-soft);">' + UI.esc(DB.ROLES[e.role].label) + '</div></div></div>' +
            UI.pill(isIn ? "Présent" : "Absent", isIn ? "ok" : "neutral") + '</div>';
        }).join("")
      ) +
      '</div>' +
      '</div>';

    container.querySelector("#db-refresh").addEventListener("click", function () { global.Modules.dashboard(container, user); });
    container.querySelectorAll("[data-route]").forEach(function (el) {
      el.addEventListener("click", function () { location.hash = "#/" + el.getAttribute("data-route"); });
    });
  };
})(window);
